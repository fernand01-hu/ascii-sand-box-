[package]
name = "ascii_engine"
version = "0.1.0"
edition = "2021"
description = "Turns 3D meshes into fields of oriented ASCII glyph cards."
license = "MIT"
publish = false

[features]
# Platform-independent math (pure Rust libm): same seed, same scene on every target.
libm = ["dep:libm"]
# Test scenes (the procedural pine). Dev/test builds only, never production.
testbed = []

[dependencies]
libm = { version = "0.2", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
