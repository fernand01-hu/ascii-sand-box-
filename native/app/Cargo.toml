[package]
name = "ascii_native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# One app for every platform: the library is the shell (window, input, frame
# loop, job executor); the binary adds the desktop command line and the
# off-screen tools. On the web, wasm-pack builds the library.
[lib]
name = "ascii_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ascii-scene"
path = "src/main.rs"

[dependencies]
ascii_core.workspace = true
ascii_render.workspace = true
ascii_engine.workspace = true
winit.workspace = true
wgpu.workspace = true
glam.workspace = true
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
png.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Worker", "MessageEvent", "ErrorEvent", "Window", "Document", "HtmlCanvasElement", "Element", "console"] }
